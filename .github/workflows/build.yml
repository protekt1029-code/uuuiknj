name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d _tmp
          INNER=$(find _tmp -name "gradlew" | head -1 | xargs dirname)
          cp -r "$INNER"/. .
          rm -rf _tmp

      - name: Fix gradlew
        run: |
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME="`pwd -P`"
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          JAVACMD="java"
          if [ -n "$JAVA_HOME" ] ; then
              JAVACMD="$JAVA_HOME/bin/java"
          fi
          exec "$JAVACMD" $JAVA_OPTS \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteScanner-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
